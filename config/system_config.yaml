# System Configuration
# 5G and Satellite-Based AI Drone System for Precision Agriculture
# Author: Mudassir Hussain | Version: 1.0 | Date: April 28, 2026

system:
  name: "AgriDrone-5G-NTN"
  version: "1.0.0"
  environment: "development"

connectivity:
  primary: "5G"
  fallback: "LEO_SATELLITE"
  5g_min_rssi_dbm: -90
  ntn_min_rssi_dbm: -100
  urllc_latency_target_ms: 10
  ntn_latency_target_ms: 50

edge_computing:
  node_id: "EDGE-NODE-01"
  cloud_sync_interval_sec: 30
  local_storage_gb: 500
  ai_inference_latency_ms: 15

ai_models:
  crop_classifier_version: "1.0.0"
  ndvi_healthy_threshold: 0.6
  ndvi_stressed_threshold: 0.4
  target_accuracy_pct: 90
  model_update_interval_hours: 24

security:
  encryption: "AES-256"
  tls_version: "1.3"
  zero_trust_enabled: true
  auth_method: "certificate"

logging:
  level: "INFO"
  retention_days: 90
  cloud_backup: true
